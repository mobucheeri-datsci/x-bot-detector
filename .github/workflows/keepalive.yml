name: Keep backend awake

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          status=$(curl -s -o /tmp/health.json -w "%{http_code}" --max-time 60 --retry 3 --retry-delay 20 https://mobucheeri-twitter-bot-detector.hf.space/health)
          echo "HTTP $status"
          cat /tmp/health.json || true
          if [ "$status" != "200" ]; then
            echo "Health check failed"
            exit 1
          fi
