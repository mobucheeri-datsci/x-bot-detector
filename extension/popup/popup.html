<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bot Detector</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="header-title">X Bot Detector</div>
  </div>

  <div id="loading" class="section" style="display:none;">
    <div class="muted center">Analysing profile...</div>
  </div>

  <div id="not-twitter" class="section">
    <div class="muted center">Navigate to a profile to analyse.</div>
  </div>

  <div id="result" class="section" style="display:none;">
    <button id="open-fullview" class="open-fullview-btn">Open in new tab</button>
    <div class="score-container">
      <div id="score-number" class="score-number">--</div>
      <div class="muted">out of 100</div>
    </div>

    <div class="badge-row">
      <span class="label-text">Analysis</span>
      <span id="label-badge" class="badge">--</span>
    </div>

    <div class="score-bar-track">
      <div id="score-bar" class="score-bar"></div>
    </div>

    <div id="username-display" class="username">@username</div>
    <div id="confidence-text" class="muted center">Confidence: --</div>

    <div id="legend" class="legend"></div>

    <div class="divider"></div>

    <div id="override-banner" class="override-banner" style="display:none;"></div>

    <div class="signals-label">Why this score?</div>
    <div id="contrib-grid" class="contrib-grid" style="display:none;">
      <div class="contrib-col">
        <div class="contrib-col-title contrib-col-bot">toward bot</div>
        <div id="contrib-bot-list"></div>
      </div>
      <div class="contrib-col">
        <div class="contrib-col-title contrib-col-human">toward human</div>
        <div id="contrib-human-list"></div>
      </div>
    </div>
    <div id="signals-list" class="signals-list"></div>
  </div>

  <div id="thread-mode" class="section" style="display:none;">
    <div class="thread-title">Thread scan</div>
     <div id="thread-counts"></div>
  </div>

  <div id="error" class="section" style="display:none;">
    <div class="error-text" id="error-text">Something went wrong.</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
